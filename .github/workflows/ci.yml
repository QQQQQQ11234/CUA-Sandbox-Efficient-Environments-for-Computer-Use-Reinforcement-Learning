name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m compileall -q rl_web_agent scripts experiments
      - run: uv run pytest -q tests/test_agent_interface.py tests/test_route_lifecycle.py tests/test_state_audit.py tests/test_non_db_state.py
